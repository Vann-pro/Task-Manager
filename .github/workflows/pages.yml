name: Build dan Publikasi Ke Github Pages

on: 
 push:
  branches: [main]
 workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
   runs-on: ubuntu-latest
   steps:
     - uses: action/checkout@v4
     - name: Uji logika C++ (native)
       run: bash scripts/test.sh
     - uses: mymindstorm/setup-emsdk@v14
       with:
        version: 3.1.64
     - name: Kompilasi C++ ke WebAssembly
       run: bash scripts/build.sh
     - uses: actions/configure-pages@v5
     - uses: actions/upload-pages-artifact@v3
       with:
        path: web

deploy:
  needs: build
  runs-on: ubuntu-latest
  environtment:
    name: github-pages
    url: ${{ steps.deployment.outputs.page_url
  steps:
    - id: deployment
      uses: actions/deploy-pages@v4
